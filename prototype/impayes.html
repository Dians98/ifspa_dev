<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impayés · IFSPA</title>
<link rel="icon" href="assets/img/logo-ifspa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .tableau-conteneur { position: relative; }
  @media (max-width: 860px) { .coquille { grid-template-columns: minmax(0, 1fr); } }
  .mob { display: none; }
  .synthese { display: flex; flex-wrap: wrap; align-items: baseline; gap: .35rem 1.5rem; padding: .9rem 1.25rem; border-bottom: 1px solid var(--bordure); background: var(--rose-pale); font-size: .875rem; color: var(--texte-2); }
  .synthese b { font-size: 1.1rem; color: var(--texte); font-variant-numeric: tabular-nums; }
  .synthese b.retard { color: var(--retard); }
  .mois-liste { display: block; font-size: .74rem; color: var(--texte-2); white-space: nowrap; }
  .tel { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tuteur { display: block; font-size: .74rem; color: var(--texte-2); white-space: nowrap; }
  .actions-ligne { display: flex; gap: .35rem; justify-content: flex-end; }
  @media (max-width: 1180px) { .col-3 { display: none; } }
  @media (max-width: 860px) { .col-2 { display: none; } }
  @media (max-width: 560px) {
    .barre-outils .saisie { flex: 1 1 140px; min-width: 0; }
    .tableau td, .tableau th { padding-left: .65rem; padding-right: .65rem; }
    .col-1 { display: none; }
    .mob { display: block; }
    .personne b { white-space: normal; }
    .actions-ligne { flex-direction: column; align-items: flex-end; }
  }
</style>
</head>
<body data-page="impayes" data-fil="Écolage/Impayés">
<div class="coquille">
  <aside class="barre" data-barre></aside>
  <div class="contenu">
    <header class="entete" data-entete></header>
    <main class="page">
      <div class="page-titre">
        <div>
          <h1>Étudiants en retard de paiement</h1>
          <p>Situation au 12 mars 2027 : droits d'inscription et mensualités d'octobre à mars exigibles.</p>
        </div>
        <div class="actions">
          <button class="btn btn-secondaire" type="button" data-toast="Fichier impayes-2027-03-12.xlsx en cours de téléchargement (prototype).">Exporter en Excel</button>
        </div>
      </div>

      <section class="panneau">
        <div class="barre-outils" role="search">
          <div class="recherche">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="saisie" type="search" id="f-q" placeholder="Nom ou matricule…" aria-label="Rechercher un étudiant">
          </div>
          <select class="saisie" id="f-filiere" aria-label="Filière">
            <option value="">Toutes les filières</option><option value="IF">Infirmier(e)s</option><option value="SF">Sage-femmes</option>
          </select>
          <select class="saisie" id="f-niveau" aria-label="Niveau">
            <option value="">Tous les niveaux</option><option value="1">1re année</option><option value="2">2e année</option><option value="3">3e année</option>
          </select>
          <select class="saisie" id="f-mois" aria-label="Mois de retard">
            <option value="0">Tout retard</option><option value="2">2 mois et plus</option><option value="3">3 mois et plus</option><option value="4">4 mois et plus</option>
          </select>
        </div>
        <p class="synthese" id="synthese"></p>
        <div class="tableau-conteneur">
          <table class="tableau">
            <thead>
              <tr>
                <th>Étudiant</th>
                <th class="col-3">Filière · niveau</th>
                <th class="col-1">Mois en retard</th>
                <th class="a-droite">Montant du retard</th>
                <th class="col-2">Dernier paiement</th>
                <th class="col-1">Tuteur à relancer</th>
                <th class="a-droite col-1"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="lignes"></tbody>
            <tfoot id="pied"></tfoot>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  const { ETUDIANTS, PAIEMENTS, FILIERES, echeancier, situation, ar, dateFr, photo, nomComplet, niveau } = IFSPA;
  const $ = (s) => document.querySelector(s);
  const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

  const base = ETUDIANTS.filter((e) => e.statut === "ACTIF").map((e) => {
    const s = situation(e);
    const impayes = echeancier(e).filter((l) => l.echue && l.statut !== "paye").map((l) => l.court === "Droits" ? "droits" : l.court);
    const arr = false;
    const dernier = PAIEMENTS.filter((p) => p.etudiant === e && !p.annule).pop();
    return { e, s, impayes, dernier, arr };
  }).filter((x) => x.s.retard > 0).sort((a, b) => b.s.retard - a.s.retard);

  function afficher() {
    const q = norm($("#f-q").value.trim()), f = $("#f-filiere").value, n = $("#f-niveau").value, m = Number($("#f-mois").value);
    const liste = base.filter(({ e, s }) =>
      (!f || e.filiere === f) && (!n || e.niveau === Number(n)) && s.moisRetard >= m &&
      (!q || norm(nomComplet(e) + " " + e.matricule).includes(q)));
    const total = liste.reduce((t, x) => t + x.s.retard, 0);
    const lourds = liste.filter((x) => x.s.moisRetard >= 3).length;
    $("#synthese").innerHTML = `<span><b>${liste.length}</b> étudiant${liste.length > 1 ? "s" : ""} en retard</span><span><b class="retard">${ar(total)}</b> à recouvrer</span><span><b>${lourds}</b> avec 3 mois ou plus</span>`;
    $("#lignes").innerHTML = liste.length ? liste.map(({ e, s, impayes, dernier, arr }) => `
      <tr>
        <td><div class="personne"><img src="${photo(e)}" alt=""><div><b><a href="etudiant.html?id=${e.id}" style="color:inherit;text-decoration:none">${nomComplet(e)}</a></b><span class="matricule">${e.matricule}</span></div></div></td>
        <td class="col-3"><span class="badge badge-${e.filiere.toLowerCase()}">${FILIERES[e.filiere].nom}</span><span class="mois-liste" style="margin-top:.2rem">${niveau(e.niveau)}${e.redoublant ? " · redoublant(e)" : ""}</span></td>
        <td class="col-1"><span class="badge ${s.moisRetard >= 2 || arr ? "badge-retard" : "badge-partiel"}">${s.moisRetard} mois</span><span class="mois-liste" style="margin-top:.2rem">${impayes.join(", ")}</span></td>
        <td class="a-droite"><b class="montant retard">${ar(s.retard)}</b><span class="mois-liste mob">${s.moisRetard} mois</span><span class="mob" style="margin-top:.4rem"><a class="btn btn-accent btn-petit" href="encaissement.html?id=${e.id}">Encaisser</a></span></td>
        <td class="col-2">${dernier ? `<span class="montant">${dateFr(dernier.date)}</span><span class="mois-liste">${ar(dernier.montant)}</span>` : `<span class="muet">Aucun</span>`}</td>
        <td class="col-1"><a class="tel" href="tel:${e.telTuteur.replace(/\s/g, "")}">${e.telTuteur}</a><span class="tuteur">${e.tuteur}</span></td>
        <td class="col-1"><div class="actions-ligne">
          <a class="btn btn-fantome btn-petit" href="releve.html?id=${e.id}">Relevé</a>
          <a class="btn btn-accent btn-petit" href="encaissement.html?id=${e.id}">Encaisser</a>
        </div></td>
      </tr>`).join("") : `<tr><td colspan="7" class="vide">Aucun étudiant en retard pour ces critères.</td></tr>`;
    $("#pied").innerHTML = liste.length ? `<tr><td colspan="3" class="total-libelle">Total · ${liste.length} étudiant${liste.length > 1 ? "s" : ""}</td><td class="a-droite montant retard">${ar(total)}</td><td colspan="3"></td></tr>` : "";
    // Aligne le libellé du pied quand des colonnes sont masquées (mobile)
    const cachees = [...document.querySelectorAll("thead th")].slice(0, 3).filter((th) => getComputedStyle(th).display === "none").length;
    const lib = document.querySelector(".total-libelle"); if (lib) lib.colSpan = 3 - cachees;
    const fin = document.querySelector("#pied td:last-child");
    if (fin) { const nb = [...document.querySelectorAll("thead th")].slice(4).filter((th) => getComputedStyle(th).display !== "none").length; if (nb) fin.colSpan = nb; else fin.remove(); }
  }
  ["#f-q", "#f-filiere", "#f-niveau", "#f-mois"].forEach((s) => $(s).addEventListener("input", afficher));
  addEventListener("resize", afficher);
  afficher();
</script>
</body>
</html>

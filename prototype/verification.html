<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérification d'un reçu · IFSPA</title>
<link rel="icon" href="assets/img/logo-ifspa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  body { background: var(--rose-pale); min-height: 100vh; display: flex; flex-direction: column; }
  .haut { display: flex; align-items: center; gap: .75rem; padding: 1rem clamp(1rem, 4vw, 2.5rem); background: #fff; border-bottom: 1px solid var(--bordure); }
  .haut img { width: 52px; height: auto; }
  .haut b { display: block; font: 700 1.1rem/1.1 var(--police-titre); color: var(--primaire); }
  .haut span { font-size: .78rem; color: var(--texte-2); }
  main { flex: 1; display: grid; place-items: start center; padding: clamp(1.5rem, 5vw, 4rem) 1rem; }
  .carte { width: min(560px, 100%); background: #fff; border-radius: 16px; box-shadow: var(--ombre-2); overflow: hidden; }
  .verdict { display: flex; gap: 1rem; align-items: center; padding: 1.5rem; }
  .verdict .pastille { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .verdict svg { width: 28px; height: 28px; }
  .verdict h1 { font: 700 1.45rem/1.2 var(--police-titre); }
  .verdict p { margin: .25rem 0 0; color: var(--texte-2); font-size: .9rem; }
  .valide .pastille { background: var(--paye-pale); color: var(--paye); }
  .valide h1 { color: var(--paye); }
  .annule .pastille { background: var(--retard-pale); color: var(--retard); }
  .annule h1 { color: var(--retard); }
  .inconnu .pastille { background: var(--partiel-pale); color: var(--partiel); }
  .inconnu h1 { color: var(--partiel); }
  .details { border-top: 1px solid var(--bordure); padding: 1.25rem 1.5rem; }
  .details .liste-def { grid-template-columns: 10rem 1fr; }
  .note { padding: 1rem 1.5rem; background: var(--fond-2); font-size: .82rem; color: var(--texte-2); border-top: 1px solid var(--bordure); }
  .exemples { margin-top: 1.25rem; font-size: .82rem; color: var(--texte-2); text-align: center; }
  footer { text-align: center; padding: 1.5rem; font-size: .75rem; color: var(--texte-2); }
  @media (max-width: 560px) { .details .liste-def { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header class="haut">
    <img src="assets/img/logo-ifspa.png" alt="Logo de l'IFSPA">
    <div><b>IFSPA</b><span>Institut de Formation Supérieur des Paramédicaux Atsinanana · Toamasina</span></div>
  </header>
  <main>
    <div>
      <div class="carte" id="carte"></div>
      <p class="exemples">Démonstration : <a href="verification.html?recu=R-2027-00022">reçu valide</a> · <a href="verification.html?recu=R-2027-00015">reçu annulé</a> · <a href="verification.html?recu=R-2027-99999">reçu inconnu</a></p>
    </div>
  </main>
  <footer>© 2027 IFSPA — Conçu et réalisé par <a href="https://portfolio-blue-iota-21.vercel.app/" target="_blank" rel="noopener">Diano ANDRIANTSALAMA</a></footer>
<script src="assets/data.js"></script>
<script>
  const { PAIEMENTS, ar, dateFr, nomComplet, modeLibelle, FILIERES, niveau } = IFSPA;
  const numero = new URLSearchParams(location.search).get("recu") || PAIEMENTS.filter((p) => !p.annule).at(-1).recu;
  const p = PAIEMENTS.find((x) => x.recu === numero);
  const ico = {
    ok: '<path d="M20 6 9 17l-5-5"/>',
    non: '<path d="M18 6 6 18M6 6l12 12"/>',
    question: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ico[k]}</svg>`;
  const carte = document.getElementById("carte");
  // Nom partiellement masqué : la page est publique.
  const masquer = (e) => `${e.nom.charAt(0)}${"•".repeat(Math.max(3, e.nom.length - 2))}${e.nom.slice(-1)} ${e.prenoms.split(" ")[0]}`;

  if (!p) {
    carte.innerHTML = `<div class="verdict inconnu"><span class="pastille">${svg("question")}</span><div><h1>Reçu introuvable</h1><p>Aucun reçu n° <b>${numero}</b> n'a été émis par l'IFSPA. Ce document n'est pas authentique : contactez le secrétariat de l'institut.</p></div></div>`;
  } else {
    const e = p.etudiant;
    carte.innerHTML = `
      <div class="verdict ${p.annule ? "annule" : "valide"}">
        <span class="pastille">${svg(p.annule ? "non" : "ok")}</span>
        <div><h1>${p.annule ? "Reçu annulé" : "Reçu authentique"}</h1>
        <p>${p.annule ? "Ce reçu a bien été émis par l'IFSPA, mais il a été annulé. Il ne vaut pas preuve de paiement." : "Ce reçu a bien été émis par l'IFSPA et il est valide."}</p></div>
      </div>
      <div class="details">
        <dl class="liste-def">
          <dt>N° de reçu</dt><dd class="tabulaire">${p.recu}</dd>
          <dt>Date</dt><dd>${dateFr(p.date)}</dd>
          <dt>Montant</dt><dd class="tabulaire fort">${ar(p.montant)}</dd>
          <dt>Mode</dt><dd>${modeLibelle(p.mode)}</dd>
          <dt>Étudiant</dt><dd>${masquer(e)} · <span class="matricule">${e.matricule}</span></dd>
          <dt>Filière</dt><dd>${FILIERES[e.filiere].nom} · ${niveau(e.niveau)}</dd>
          ${p.annule ? `<dt>Annulé le</dt><dd>${p.dateAnnulation} — motif : ${p.motifAnnulation}</dd>` : ""}
        </dl>
      </div>
      <p class="note">Pour protéger les données personnelles, le nom de l'étudiant est partiellement masqué. En cas de doute, présentez le reçu original au secrétariat.</p>`;
  }
</script>
</body>
</html>

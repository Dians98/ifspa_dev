# Environnement de test complet (docker/test/) à chaque push et pull request : lint, Vitest, build, typecheck, E2E.
name: Tests

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  # Sur main, les tests passent par deploiement.yml, avant la mise en production.
  workflow_call:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Environnement de test Docker
        run: docker compose -f docker/test/compose.yml run --rm --build tests
        env:
          # Version du PostgreSQL de cPanel (production).
          POSTGRES_VERSION: "10"

      - name: Arrêt de l'environnement
        if: always()
        run: docker compose -f docker/test/compose.yml down --remove-orphans

      - name: Bilan
        if: always()
        run: |
          if [ -f test-results/docker/bilan.txt ]; then
            { echo '```'; cat test-results/docker/bilan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: test-results/docker/
          retention-days: 14
